services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      AI_GATEWAY_UPSTREAM: ai-gateway:8000
    depends_on:
      ai-gateway:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  ai-gateway:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile.ai
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      CONSTRUCTFLOW_HTTP_HOST: 0.0.0.0
      CONSTRUCTFLOW_AI_TOKEN: ${CONSTRUCTFLOW_AI_TOKEN:-}
      CONSTRUCTFLOW_AI_ALLOWED_ORIGINS: ${CONSTRUCTFLOW_AI_ALLOWED_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONSTRUCTFLOW_AI_MODEL: ${CONSTRUCTFLOW_AI_MODEL:-gpt-4o-mini}
      CONSTRUCTFLOW_AI_BASE_URL: ${CONSTRUCTFLOW_AI_BASE_URL:-https://api.openai.com/v1/chat/completions}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
